name: changelog-lint
description: Lint CHANGELOG.md against the Keep a Changelog format and annotate the PR.
author: Tanmesh Kekane
branding:
  icon: list
  color: blue
inputs:
  files:
    description: Changelog file(s), space separated
    default: CHANGELOG.md
  args:
    description: Extra flags, e.g. "--require-links -W"
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install --quiet "${{ github.action_path }}"
    - shell: bash
      run: changelog-lint --format github ${{ inputs.args }} ${{ inputs.files }}
